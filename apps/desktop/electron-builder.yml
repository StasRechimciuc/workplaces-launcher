appId: com.workspacelauncher.app
productName: Workspace Launcher
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# Copied into the packaged app's Resources folder (reachable via
# process.resourcesPath) — main/index.ts resolves the tray icon from
# there in a packaged build, or directly from this source path in dev
# (is.dev). Not bundled by electron-vite's renderer/main build steps,
# since it's a plain static asset neither process imports as code.
extraResources:
  - from: resources/tray
    to: tray
# The native window helper (native/wl-helper, built by `npm run
# build:helper`) ships in Contents/Helpers — the layout the window-
# tracking spike verified inherits the app's Accessibility grant
# (WCs/WC__window-tracking.md, finding C). `extraFiles` is relative to
# Contents/ on macOS; main/platform/macos/wl-helper-path.ts resolves it
# from there. electron-builder only warns on a missing source, so
# afterPack (scripts/verify-helper.cjs) fails the build instead.
afterPack: scripts/verify-helper.cjs
win:
  target:
    - nsis
  # No code signing / EV cert yet — same deferral as mac's notarization
  # below. Unsigned installers trigger SmartScreen's "Windows protected
  # your PC" warning on first run; acceptable for internal/validation-
  # stage builds, revisit before public distribution.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  extraFiles:
    - from: native/build/wl-helper
      to: Helpers/wl-helper
  hardenedRuntime: true
  gatekeeperAssess: false
  # entitlements/notarization (Apple Developer account + signing
  # identity) are configured when there's an actual account to sign
  # with — see claude.md. Not needed for local dev builds. macOS
  # packaging is paused (Phase 3), not removed — see claude.md's
  # platform roadmap note.
