name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      matrix:
        # windows-latest is v1's target platform and must be green
        # unconditionally. macos-latest is kept alongside it, not
        # dropped, because the macOS launcher is paused (Phase 3), not
        # deleted (docs/architecture.md #1) — every test here is a
        # mocked unit test, so running both costs little and catches a
        # macOS regression now rather than only when Phase 3 starts.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
